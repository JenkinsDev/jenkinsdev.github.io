<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Little web toys made at the kitchen table by Dad and the kids.">
    <meta name="theme-color" content="#c7e3d2">
    <title>Jenkins Fun House</title>
    <link rel="stylesheet" href="shared/fun.css">
    <link rel="stylesheet" href="hub.css">
    <script src="shared/paper.js"></script>
    <script defer src="shared/sound.js"></script>
    <script defer src="toys.js"></script>
    <script defer src="hub-art.js"></script>
    <script defer src="hub.js"></script>
  </head>
  <body>
    <div class="fridge">
      <section class="door freezer" aria-labelledby="title">
        <h1 id="title" class="visually-hidden">Jenkins Fun House</h1>
        <div class="magnet-board" id="magnets" aria-hidden="true"></div>
        <p class="hint">psst… you can move the letters!</p>
        <button class="tidy" id="tidy" type="button">tidy up</button>
        <button class="mute-magnet" id="mute" type="button" aria-pressed="false" aria-label="Sound on">🔊</button>
        <span class="handle" aria-hidden="true"></span>
      </section>

      <main class="door main-door">
        <ul class="drawings" id="grid" aria-label="Toys"></ul>

        <aside class="sticky-note">
          <p>Made at the kitchen table by Dad &amp; the kids.</p>
          <p>Got an idea for a toy? Draw it and stick it on the fridge!</p>
          <p class="grownups"><a href="/">grown-up site →</a></p>
        </aside>
        <span class="handle" aria-hidden="true"></span>
      </main>
    </div>
  </body>
</html>
