<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="FREE PLAY: a little arcade of original games for all ages. No coins, no ads.">
    <meta name="theme-color" content="#140a2b">
    <title>FREE PLAY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=VT323&family=Silkscreen:wght@400;700&display=swap">
    <link rel="stylesheet" href="hub.css">
    <script defer src="shared/sound.js"></script>
    <script defer src="games.js"></script>
    <script defer src="machines.js"></script>
    <script defer src="scenes.js"></script>
    <script defer src="hub.js"></script>
  </head>
  <body>
    <header class="top">
      <h1 class="neon">FREE PLAY</h1>
      <p class="sub">no coins · no ads · all ages</p>
      <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Sound on">♪</button>
    </header>

    <main>
      <ul class="lineup" id="lineup" aria-label="Games"></ul>
      <p class="swipe" aria-hidden="true">← swipe the floor →</p>
    </main>

    <footer><a class="credit" href="/">jenkinsdev.us</a></footer>

    <dialog class="card" id="card" aria-labelledby="card-name">
      <div class="crt">
        <div class="crt-top"><span>1UP</span><span>SELECT GAME</span><span>2UP</span></div>
        <canvas class="preview" id="preview" width="64" height="48"></canvas>
        <h2 class="card-name" id="card-name"></h2>
        <p class="players" id="card-players"></p>
        <div class="stats" id="card-stats"></div>
        <p class="hook" id="card-hook"></p>
        <div class="card-actions">
          <button class="nav" id="prev" type="button" aria-label="Previous game">◀</button>
          <a class="start" id="start" href="#">▶ PRESS START</a>
          <button class="nav" id="next" type="button" aria-label="Next game">▶</button>
        </div>
      </div>
      <button class="close" id="close" type="button" aria-label="Back to the arcade">✕</button>
    </dialog>
  </body>
</html>
