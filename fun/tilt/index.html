<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10"><meta name="description" content="Roll your marble into your cup. Both marbles move when you tilt the tray.">
<title>TILT! · FREE PLAY</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=VT323&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="../shared/crt.css?v=202611052235"><link rel="stylesheet" href="game.css?v=202611052235">
<script defer src="../shared/sound.js?v=202611052235"></script><script defer src="../shared/engine.js?v=202611052235"></script><script defer src="../shared/controls.js?v=202611052235"></script>
<script defer src="rules.js?v=202611052235"></script><script defer src="render.js?v=202611052235"></script><script defer src="game.js?v=202611052235"></script>
</head>
<body><main>
<section class="screen title-screen" data-screen="title">
<h1 class="logo">TILT!</h1><p class="lede">Roll your marble into your cup. Both marbles move.</p>
<div class="option"><h2 class="option-label" id="players-label">Players</h2><div class="chips" id="modes" role="group" aria-labelledby="players-label"><button class="chip" data-value="1p">1P</button><button class="chip" data-value="2p">2P</button></div><p id="mode-rule"></p></div>
<div class="option" id="level-option"><h2 class="option-label" id="computer-label">Computer</h2><div class="chips" id="levels" role="group" aria-labelledby="computer-label"><button class="chip" data-value="easy">Easy</button><button class="chip" data-value="medium">Medium</button><button class="chip" data-value="hard">Hard</button><button class="chip" data-value="impossible">Impossible</button></div></div>
<div class="option"><h2 class="option-label" id="tray-label">Tray</h2><div class="chips" id="layouts" role="group" aria-labelledby="tray-label"></div></div>
<p class="rule">12 turns. Most points wins. No timer.</p>
<div class="option controls"><h2 class="option-label">Controls</h2><div id="control-cards" class="control-cards"></div></div>
<button class="fp-btn play" id="play" data-autofocus>PLAY</button>
</section>
<section class="screen play-screen" data-screen="play" hidden>
<div class="match-head"><div id="score0" class="score"></div><span id="turns"></span><div id="score1" class="score"></div></div>
<p id="banner" role="status" aria-live="polite"></p>
<div class="board"><canvas id="scene" width="192" height="192" role="img" aria-label="Wooden maze with two marbles and matching cups"></canvas></div>
<div id="controls"><p id="control-owner"></p><div class="directions" id="directions"></div><p id="preview" aria-live="polite">Choose a direction to see both stops.</p><button class="fp-btn" id="roll">ROLL</button></div>
<button class="fp-btn secondary leave" id="leave">SETUP</button>
</section>
<section class="screen over-screen" data-screen="over" hidden><h1 class="logo" id="result"></h1><p id="final-score"></p><p>12 turns played.</p><div class="actions"><button class="fp-btn" id="rematch" data-autofocus>REMATCH</button><button class="fp-btn secondary" id="setup">SETUP</button></div></section>
</main></body></html>
