<!doctype html>
<!-- Borrowed Blocks: standalone arcade page. Shared shell and controls load before the game. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="description" content="Pick from a shared rack and fit more squares on your board." />
    <title>Borrowed Blocks · FREE PLAY</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23ffd23f' d='M1 1h7v7H1zm0 8h7v7H1zm8 0h7v7H9z'/%3E%3C/svg%3E"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=VT323&family=Silkscreen:wght@400;700&display=swap"
    />
    <link rel="stylesheet" href="../shared/crt.css?v=202611052235" />
    <link rel="stylesheet" href="game.css?v=202611052235" />
    <script defer src="../shared/sound.js?v=202611052235"></script>
    <script defer src="../shared/engine.js?v=202611052235"></script>
    <script defer src="../shared/controls.js?v=202611052235"></script>
    <script defer src="rules.js?v=202611052235"></script>
    <script defer src="render.js?v=202611052235"></script>
    <script defer src="game.js?v=202611052235"></script>
  </head>
  <body>
    <main class="bb">
      <section class="screen title-screen" data-screen="title">
        <h1 class="logo">BORROWED<br /><span>BLOCKS</span></h1>
        <p class="lede">Fit more squares on your board.</p>
        <div class="option">
          <h2 class="option-label">Players</h2>
          <div class="chips" id="modes" role="group" aria-label="Players">
            <button class="chip" data-mode="1p">1P</button><button class="chip" data-mode="2p">2P</button>
          </div>
          <p id="mode-rule"></p>
        </div>
        <div class="option" id="level-option">
          <h2 class="option-label">Computer</h2>
          <div class="chips" id="levels" role="group" aria-label="Computer level"></div>
        </div>
        <div class="option controls">
          <h2 class="option-label">Controls</h2>
          <div class="control-cards" id="control-cards"></div>
        </div>
        <button class="fp-btn" id="play" data-autofocus>PLAY</button>
      </section>
      <section class="screen play-screen" data-screen="play" hidden>
        <div class="turn-head">
          <h2 id="banner" aria-live="polite"></h2>
          <span id="turn-count"></span>
        </div>
        <div id="boards" class="boards"></div>
        <div class="supply">
          <div class="rack-area">
            <p class="option-label">Shared rack</p>
            <div id="rack" class="rack"></div>
          </div>
          <div class="queue-area">
            <p class="option-label">Next</p>
            <div id="queue"></div>
          </div>
        </div>
        <div class="actions" id="actions">
          <p id="hint" aria-live="polite">Pick a piece.</p>
          <div class="tools">
            <button class="fp-btn secondary" id="rotate">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a7 7 0 1 0 1 6M18 3v6h-6" /></svg>ROTATE</button
            ><button class="fp-btn secondary" id="cancel">CANCEL</button><button class="fp-btn secondary" id="pass">PASS</button>
          </div>
          <button class="fp-btn" id="place">PLACE</button>
        </div>
      </section>
      <section class="screen over-screen" data-screen="over" hidden>
        <h2 class="logo" id="result"></h2>
        <p id="final-score"></p>
        <div class="over-actions">
          <button class="fp-btn" id="again" data-autofocus>REMATCH</button><button class="fp-btn secondary" id="change">SETUP</button>
        </div>
      </section>
    </main>
  </body>
</html>
